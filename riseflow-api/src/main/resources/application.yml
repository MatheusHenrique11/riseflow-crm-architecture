spring:
  application:
    name: riseflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/riseflow
    username: riseflow
    password: riseflow
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: riseflow
    password: riseflow
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/riseflow

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.risecode.riseflow: DEBUG
